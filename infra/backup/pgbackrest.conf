# pgBackRest — lokacia.ge production Postgres (PostGIS 16).
# Repo: Cloudflare R2 (S3 API), encrypted client-side. Retention gives ≥ 14 days of point-in-time recovery:
#   weekly full (Sun 02:00) × 3 kept  +  daily differential (02:00)  +  continuous WAL archiving.
# Secrets come from env (PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS) — never commit them.

[global]
repo1-type=s3
repo1-s3-endpoint=<account-id>.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-bucket=lokacia-pg-backups
repo1-s3-uri-style=path
repo1-path=/pgbackrest/prod
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=21
repo1-retention-diff=14
repo1-retention-archive-type=full
repo1-bundle=y
repo1-block=y

process-max=4
compress-type=zst
compress-level=3
start-fast=y
delta=y
log-level-console=info
log-level-file=detail
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=10GiB

[lokacia]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
