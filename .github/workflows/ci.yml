name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lokacia }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://lokacia:lokacia@localhost:5432/lokacia
      TEST_DATABASE_URL: postgres://lokacia:lokacia@localhost:5432/lokacia_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d lokacia -f infra/postgres/init.sql
      - run: pnpm i --frozen-lockfile
      - run: pnpm check:ka
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  e2e:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: docker compose -f infra/docker-compose.yml up -d --wait
      - run: pnpm i --frozen-lockfile && pnpm db:migrate && pnpm db:seed && pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
