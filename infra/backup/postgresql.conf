# Production postgresql.conf fragment for lokacia.ge (PostGIS 16). Mounted by infra/docker-compose.prod.yml.
listen_addresses = '*'
max_connections = 200                 # apps connect through PgBouncer (transaction pooling)
shared_buffers = 2GB                  # ~25% of RAM (8 GB host)
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
random_page_cost = 1.1                # SSD
effective_io_concurrency = 200
shared_preload_libraries = 'pg_stat_statements'
search_path = 'public, extensions'

# --- WAL + PITR (pgBackRest) ---
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=lokacia archive-push %p'
archive_timeout = 60                  # RPO ≤ 1 min even on quiet traffic
max_wal_senders = 5
max_wal_size = 4GB
min_wal_size = 1GB
wal_compression = zstd

# --- observability ---
log_min_duration_statement = 500      # slow queries (ms)
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
track_io_timing = on
