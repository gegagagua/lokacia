name: lokacia
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lokacia }
    ports: ['5432:5432']
    volumes: [pg:/var/lib/postgresql/data, ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, retries: 20 }
  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment: { MEILI_MASTER_KEY: dev_master_key, MEILI_NO_ANALYTICS: 'true' }
    ports: ['7700:7700']
    volumes: [meili:/meili_data]
    healthcheck: { test: ['CMD', 'curl', '-f', 'http://localhost:7700/health'], interval: 5s, retries: 20 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio123 }
    ports: ['9000:9000', '9001:9001']
    volumes: [minio:/data]
    healthcheck: { test: ['CMD', 'mc', 'ready', 'local'], interval: 5s, retries: 20 }
  imgproxy:
    image: darthsim/imgproxy:latest
    environment: { IMGPROXY_USE_S3: 'true', IMGPROXY_S3_ENDPOINT: 'http://minio:9000', AWS_ACCESS_KEY_ID: minio, AWS_SECRET_ACCESS_KEY: minio123 }
    ports: ['8080:8080']
    healthcheck: { test: ['CMD', 'imgproxy', 'health'], interval: 10s, retries: 10 }
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes: { pg: {}, meili: {}, minio: {} }
